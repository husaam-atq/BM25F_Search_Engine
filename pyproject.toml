[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bm25f-research-extension"
version = "0.1.0"
description = "Post-Course Independent Retrieval Research Extension — 2026"
requires-python = ">=3.10"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["research_extension*"]

